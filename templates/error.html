{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>{{ error_code }}-{{ error_message }}</title>
  <meta name="description" content="Katen - Minimal Blog & Magazine HTML Theme" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/icon.png' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- STYLES -->
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css" media="all" />
  <link rel="stylesheet" href="{% static 'css/all.min.css' %}" type="text/css" media="all" />
  <link rel="stylesheet" href="{% static 'css/slick.css' %}" type="text/css" media="all" />
  <link rel="stylesheet" href="{% static 'css/simple-line-icons.css' %}" type="text/css" media="all" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css" media="all" />
  

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

  <script src="https://cdn.jsdelivr.net/gh/iamashruu/cursorly.js@latest/dist/cursorly.min.js"></script>

  <!-- Loading animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css" />

  <!-- loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
  <script>
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        $('#preloader').hide()
        $('.skeleton').removeClass('skeleton')
        $('body').removeClass('skeleton-lock')
      }
    })
  </script>
</head>

<body>
  <header class="header-default">
    <nav class="navbar navbar-expand-lg">
      <div class="container-xl">
        <!-- site logo -->
        <a class="navbar-brand logo-theme" href="{% url 'index' %}" aria-label="Inkwell home">
          <svg viewBox="0 0 450 120" role="img" aria-label="Inkwell logo">
            <text x="20" y="90" class="brand-word" font-family="Arial, sans-serif" font-weight="700"
              font-size="100">Inkwell<tspan class="brand-dot">.</tspan></text>
          </svg>
        </a>
      </div>
    </nav>
  </header>
  <section class="main-content">
    <div class="container-xl">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="padding-30 rounded bordered text-center">
            <!-- Error Icon -->
            <div class="mb-4">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 100px;"></i>
            </div>
            <h1>{{ error_code }}</h1>

            <h3 class="text-danger">{{ error_title }}</h3>

            <p>{{ error_message }}</p>

            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center align-items-center">
              <a href="javascript:history.back()" class="btn btn-default"><i class="fa-solid fa-arrow-left"></i> Go
                Back</a>

              <a href="{% url 'index' %}" class="btn btn-default"><i class="fa-solid fa-home"></i> Go Home</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
